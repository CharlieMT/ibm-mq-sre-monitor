# Set application check interval (e.g., 10s, 1m, 1h)
tick_rate = 5s

# Set directories for MQ check configurations
queues_dir = mq_checks_config/queues
channels_dir = mq_checks_config/channels

# Logging configuration
log_dir = mq_logs
log_file = mq_monitor.log
log_level = INFO
# Max size for the active log file (e.g., 20MB, 50MB)
log_max_size = 20MB
# Number of archived, compressed log files to keep
log_backup_count = 5
