# Set application check interval (e.g., 10s, 1m, 1h)
tick_rate = 5s

# Set directories for MQ check configurations
queues_dir = mq_checks_config/queues
channels_dir = mq_checks_config/channels
listeners_dir = mq_checks_config/listeners

# Logging configuration
log_dir = mq_logs
log_file = mq_monitor.log
log_level = INFO
# Max size for the active log file (e.g., 20MB, 50MB)
log_max_size = 20MB
# Number of archived, compressed log files to keep
log_backup_count = 5

# Alert Manager configuration
[Alerts]
global_alerts_enable = true
api_url = your_alert_manager_url_here

# --- Authentication (Dual Auth) ---
# Legacy API Key (Authorization header):
api_key = your_key_here

# Modern Access Token (X-ACCESS-TOKEN header). 
# NOTE: If provided, this will OVERRIDE the api_key!
access_token = your_token_here